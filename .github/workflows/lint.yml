# Goal: to check if my python code is syntactically correct and follows the best practices

name: Code Lint
on: 
  push: 

jobs: 
  code-linter:
    runs-on: ubuntu-22.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with: 
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt     

      - name: Code Lint 
        run: ruff check .   

  
     
name: Show Env variables

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select the environment you want
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prd

env:
  NAME: shahab
  
jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: Show plain text env
        run: echo "My name is ${{ env.NAME }}"
      - name: Show Secrets
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "::add-mask::$DOCKERHUB_PASSWORD"
          echo "One fun secret is $DOCKERHUB_PASSWORD"
      - name: Show Variables
        run: echo "My Dockerhub Username is ${{ vars.DOCKERHUB_USERNAME }}"
      - name: Show the input env
        run: echo "The selected env is ${{ inputs.environment }}"
